<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <title>今天吃什麼？｜V4 Firebase 正式版</title>
    <style>
      :root {
        font-family:
          system-ui,
          -apple-system,
          "Noto Sans TC",
          sans-serif;
        color: #28332e;
        background: #faf7ef;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      header {
        background: #fff;
        border-bottom: 1px solid #e9e4d9;
        padding: 17px max(20px, calc((100vw - 1100px) / 2));
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }
      h1 {
        font-size: 25px;
        margin: 0;
      }
      h2 {
        margin: 0 0 14px;
        font-size: 22px;
      }
      h3 {
        margin: 12px 0;
      }
      p {
        line-height: 1.65;
      }
      small,
      .muted {
        color: #7c827c;
      }
      main {
        max-width: 1100px;
        margin: auto;
        padding: 24px 18px 60px;
      }
      .panel {
        background: white;
        border: 1px solid #eee6da;
        border-radius: 20px;
        padding: 23px;
        margin-bottom: 18px;
        box-shadow: 0 5px 18px #51452309;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 15px;
      }
      .row {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }
      .between {
        justify-content: space-between;
      }
      button,
      .btn {
        background: #375c4a;
        color: white;
        border: 0;
        border-radius: 11px;
        padding: 10px 15px;
        cursor: pointer;
        font: inherit;
      }
      button:hover {
        filter: brightness(0.94);
      }
      button.secondary {
        background: #f2eee5;
        color: #35423b;
      }
      button.danger {
        background: #a34e43;
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      input,
      select,
      textarea {
        font: inherit;
        border: 1px solid #d7d9d3;
        border-radius: 10px;
        padding: 10px;
        background: #fff;
        max-width: 100%;
      }
      input[type="checkbox"] {
        width: 18px;
        height: 18px;
        accent-color: #416c54;
      }
      label {
        display: block;
        margin: 9px 0 5px;
        font-weight: 600;
      }
      textarea {
        width: 100%;
        min-height: 75px;
      }
      input[type="text"],
      input[type="number"],
      input[type="date"],
      input[type="time"],
      select {
        width: 100%;
      }
      .pill {
        display: inline-block;
        background: #e4f1e6;
        color: #286041;
        border-radius: 99px;
        padding: 5px 12px;
        font-size: 13px;
      }
      .closed {
        background: #f6e6e3;
        color: #964c3c;
      }
      .tabs {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 20px;
      }
      .tabs button.active {
        background: #375c4a;
        color: #fff;
      }
      .tabs button {
        background: #eae7df;
        color: #334238;
      }
      .menu-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        border-bottom: 1px solid #eee;
        padding: 12px 0;
      }
      .menu-item:last-child {
        border-bottom: 0;
      }
      .menu-item strong {
        display: block;
      }
      .qty {
        width: 85px !important;
      }
      .choices {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .choices label {
        font-weight: 400;
        margin: 0;
        background: #f7f5ef;
        border-radius: 9px;
        padding: 8px 10px;
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .stat {
        padding: 16px;
        background: #f6f6f0;
        border-radius: 12px;
      }
      .bag-select {
        min-width: 110px;
        width: auto;
      }
      .bag-card {
        border: 1px solid #e6e2d9;
        border-radius: 14px;
        padding: 16px;
        margin: 12px 0;
        background: #fff;
      }
      .bag-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .detail-panel {
        background: #f7f8f4;
        border-radius: 10px;
        padding: 10px;
        margin: 7px 0;
      }
      .detail-panel summary {
        cursor: pointer;
        font-weight: 600;
      }
      .bag-line {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 6px 0;
        border-bottom: 1px dashed #e4e5df;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }
      th,
      td {
        text-align: left;
        border-bottom: 1px solid #eae6df;
        padding: 10px 7px;
      }
      .scroll {
        overflow: auto;
      }
      .notice {
        background: #fff6db;
        padding: 13px;
        border-radius: 12px;
        margin: 15px 0;
      }
      .mini {
        font-size: 13px;
      }
      .right {
        text-align: right;
      }
      .pill.warn {
        background: #fff3cd;
        color: #7a5b00;
      }
      .banner {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        justify-content: space-between;
        padding: 12px max(16px, calc((100vw - 1100px) / 2));
        font-size: 14px;
        line-height: 1.6;
      }
      .banner.error {
        background: #f8dcd7;
        color: #7d2c20;
      }
      .banner.warn {
        background: #fff3cd;
        color: #6b5000;
      }
      .banner button {
        background: transparent;
        color: inherit;
        padding: 0 6px;
        font-size: 20px;
        line-height: 1;
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%);
        max-width: min(92vw, 520px);
        padding: 12px 18px;
        border-radius: 12px;
        color: #fff;
        background: #375c4a;
        box-shadow: 0 8px 24px #0003;
        z-index: 50;
        font-size: 15px;
      }
      .toast.warn {
        background: #8a6a12;
      }
      .toast.error {
        background: #a34e43;
      }
      .my-order {
        margin: 10px 0;
      }
      .hidden {
        display: none !important;
      }
      @media (max-width: 650px) {
        header {
          padding: 16px;
        }
        main {
          padding: 16px 12px;
        }
        .panel {
          padding: 16px;
        }
        .menu-item {
          align-items: flex-start;
        }
        .tabs {
          flex-wrap: nowrap;
          overflow-x: auto;
          -webkit-overflow-scrolling: touch;
          scrollbar-width: none;
          position: sticky;
          top: 0;
          z-index: 5;
          background: #faf7ef;
          margin: 0 -12px 14px;
          padding: 8px 12px;
        }
        .tabs::-webkit-scrollbar {
          display: none;
        }
        .tabs button {
          flex: 0 0 auto;
          white-space: nowrap;
          padding: 12px 16px;
        }
        h1 {
          font-size: 21px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>🍱 今天吃什麼？</h1>
        <small>V4 Firebase 正式版 · 正餐＋飲料</small>
      </div>
      <div class="row">
        <span class="pill" id="connection">正在連接 Firebase...</span
        ><span id="identity"></span
        ><button class="secondary" id="authButton" onclick="showLogin()">
          管理員登入
        </button>
      </div>
    </header>
    <div id="banner" class="banner hidden" role="alert"></div>
    <main>
      <div class="notice mini">
        同事可在不同手機／電腦同步訂餐。管理員登入後可開關場次、管理菜單、分袋及匯出。
      </div>
      <nav class="tabs" id="tabs">
        <button data-tab="order" class="active">同事訂餐</button
        ><button class="admin-only hidden" data-tab="sessions">今日開單</button
        ><button class="admin-only hidden" data-tab="shops">餐廳／菜單</button
        ><button class="admin-only hidden" data-tab="records">
          訂單統計／匯出</button
        ><button class="admin-only hidden" data-tab="bags">分袋管理</button>
      </nav>
      <div id="view"><p>正在連接資料庫...</p></div>
    </main>
    <div id="toast" class="toast hidden" role="status"></div>
    <script>
      (function () {
        var toastTimer;
        window.showBanner = function (msg, kind, key) {
          var b = document.getElementById("banner");
          if (!b) return;
          b.className = "banner " + (kind || "error");
          b.dataset.key = key || "";
          b.textContent = "";
          var t = document.createElement("span");
          t.textContent = msg;
          var x = document.createElement("button");
          x.type = "button";
          x.textContent = "×";
          x.setAttribute("aria-label", "關閉提示");
          x.onclick = function () {
            b.className = "banner hidden";
          };
          b.appendChild(t);
          b.appendChild(x);
        };
        window.hideBanner = function (key) {
          var b = document.getElementById("banner");
          if (b && (!key || b.dataset.key === key))
            b.className = "banner hidden";
        };
        window.toast = function (msg, kind) {
          var el = document.getElementById("toast");
          if (!el) return;
          el.textContent = msg;
          el.className = "toast " + (kind === "ok" ? "" : kind || "");
          clearTimeout(toastTimer);
          toastTimer = setTimeout(function () {
            el.className = "toast hidden";
          }, 4000);
        };
        function loadFail(m) {
          if (!window.__lunchReady)
            window.showBanner(
              "網站載入失敗：" +
                m +
                "。請重新整理頁面；若持續發生，請通知管理員。",
              "error",
              "load",
            );
        }
        window.addEventListener("error", function (e) {
          loadFail(e.message || "未知錯誤");
        });
        window.addEventListener("unhandledrejection", function (e) {
          loadFail((e.reason && e.reason.message) || "未知錯誤");
        });
        setTimeout(function () {
          var b = document.getElementById("banner");
          if (!window.__lunchReady && b && b.className.indexOf("hidden") > -1)
            window.showBanner(
              "連線時間比平常久，請確認手機或電腦的網路後重新整理頁面。若持續出現，請通知管理員。",
              "warn",
              "sync",
            );
        }, 10000);
      })();
    </script>
    <script type="module">
      "use strict";
      const KEY = "lunch-v4-firebase";
      const SUG = ["無糖", "一分糖", "微糖", "半糖", "少糖", "正常甜"];
      const ICE = ["溫", "熱", "常溫", "去冰", "微冰", "少冰", "正常冰"];
      const sample = () => ({
        shops: [
          {
            id: "meal-demo",
            type: "meal",
            name: "示範便當店",
            items: [
              { id: "m1", name: "蝦仁炒飯", price: 80 },
              { id: "m2", name: "肉絲炒飯", price: 80 },
              { id: "m3", name: "無骨雞排", price: 100 },
              { id: "m4", name: "香滷雞腿", price: 100 },
            ],
            sugars: [],
            ices: [],
            toppings: [],
          },
          {
            id: "drink-demo",
            type: "drink",
            name: "示範飲料店",
            items: [
              { id: "d1", name: "紅茶", price: 30 },
              { id: "d2", name: "鮮奶茶", price: 55 },
              { id: "d3", name: "綠茶", price: 30 },
            ],
            sugars: [...SUG],
            ices: [...ICE],
            toppings: [
              { id: "t1", name: "波霸", price: 10 },
              { id: "t2", name: "仙草凍", price: 10 },
            ],
          },
        ],
        sessions: {
          meal: {
            shopId: "meal-demo",
            open: true,
            deadline: "",
            selected: ["m1", "m2", "m3", "m4"],
          },
          drink: {
            shopId: "drink-demo",
            open: true,
            deadline: "",
            selected: ["d1", "d2", "d3"],
          },
        },
        orders: [],
      });
      let state = sample();
      state.shops = [];
      state.sessions = {
        meal: { shopId: "", open: false, deadline: "", selected: [] },
        drink: { shopId: "", open: false, deadline: "", selected: [] },
      };
      let tab = "order",
        shopEdit = null,
        editingOrder = null,
        editingId = null,
        formOpen = false,
        submitting = false,
        closedWarned = false;
      let cart = { meal: [], drink: [] };
      const $ = (s) => document.querySelector(s),
        uid = () => Math.random().toString(36).slice(2, 11),
        esc = (s) =>
          String(s ?? "").replace(
            /[&<>"']/g,
            (c) =>
              ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;",
              })[c],
          ),
        money = (n) => "$" + Number(n || 0).toLocaleString("zh-TW"),
        save = () => saveConfig(),
        typeName = (t) => (t === "meal" ? "🍱 正餐" : "🧋 飲料"),
        shopBy = (id) => state.shops.find((s) => s.id === id),
        active = (t) => {
          let x = state.sessions[t];
          return (
            x.open &&
            (!x.deadline || new Date(x.deadline).getTime() > Date.now())
          );
        },
        render = () => {
          if (!ready) return;
          formOpen = false;
          if (!isAdmin && tab !== "order") tab = "order";
          document
            .querySelectorAll(".admin-only")
            .forEach((b) => b.classList.toggle("hidden", !isAdmin));
          document
            .querySelectorAll("[data-tab]")
            .forEach((b) =>
              b.classList.toggle("active", b.dataset.tab === tab),
            );
          $("#view").innerHTML = {
            order: orderView,
            sessions: sessionsView,
            shops: shopsView,
            records: recordsView,
            bags: bagsView,
          }[tab]();
        };
      $("#tabs").onclick = (e) => {
        let b = e.target.closest("[data-tab]");
        if (b && (!b.classList.contains("admin-only") || isAdmin)) {
          tab = b.dataset.tab;
          render();
        }
      };
      const myUid = () => auth?.currentUser?.uid || "";
      const todayStr = () => new Date().toLocaleDateString("sv-SE");
      function canChange(o) {
        let s = state.sessions[o.type];
        return (
          !!s &&
          o.ownerUid === myUid() &&
          o.date === todayStr() &&
          s.shopId === o.shopId &&
          active(o.type)
        );
      }
      function orderSummary(o) {
        return (o.lines || [])
          .map(
            (l) =>
              esc(l.name) +
              " × " +
              l.qty +
              (l.sugar ? "／" + esc(l.sugar) : "") +
              (l.ice ? "／" + esc(l.ice) : "") +
              (l.toppings?.length
                ? "／" + l.toppings.map((x) => esc(x.name)).join("+")
                : ""),
          )
          .join("<br>");
      }
      function myOrderCard(o) {
        let can = canChange(o);
        return `<div class="stat my-order"><div class="row between"><strong>${esc(o.person)}｜${typeName(o.type)}｜${esc(o.shopName)}</strong><strong>${money(o.total)}</strong></div><div class="mini" style="margin:8px 0">${orderSummary(o)}</div>${o.note ? `<div class="mini muted">備註：${esc(o.note)}</div>` : ""}<div class="row" style="margin-top:8px">${can ? `<button onclick="showOrder('${o.type}','${o.id}')">修改</button><button class="danger" onclick="removeOrder('${o.id}')">取消訂單</button>` : '<span class="pill closed">已結單，無法修改</span>'}</div></div>`;
      }
      function orderView() {
        let me = myUid(),
          today = todayStr(),
          mine = state.orders
            .filter((o) => o.ownerUid === me)
            .slice()
            .sort((a, b) =>
              String(b.createdAt).localeCompare(String(a.createdAt)),
            ),
          todays = mine.filter((o) => o.date === today),
          earlier = mine.filter((o) => o.date !== today);
        return `<h2>今日訂餐</h2><div class="grid">${["meal", "drink"]
          .map((t) => {
            let s = state.sessions[t],
              sh = shopBy(s.shopId);
            return `<section class="panel"><div class="row between"><h3>${typeName(t)}</h3><span class="pill ${active(t) ? "" : "closed"}">${active(t) ? "開放訂餐" : "已結單"}</span></div><p>${esc(sh?.name || "尚未選擇店家")}</p><small>${s.deadline ? "截止：" + esc(s.deadline.replace("T", " ")) : "未設定截止時間"}</small>${active(t) && sh ? `<p><button onclick="showOrder('${t}')">開始訂${t === "meal" ? "餐" : "飲料"}</button></p>` : ""}</section>`;
          })
          .join(
            "",
          )}</div><section class="panel"><h3>我的訂單（今天）</h3>${todays.length ? todays.map(myOrderCard).join("") : '<p class="muted">今天還沒有送出訂單</p>'}<p class="mini muted">結單前可以修改或取消。訂單綁定在這個瀏覽器，換手機、換瀏覽器或清除瀏覽資料後就看不到也無法修改，請直接通知管理員。</p>${earlier.length ? `<details class="detail-panel"><summary>更早的訂單（${earlier.length} 筆）</summary>${earlier.map(myOrderCard).join("")}</details>` : ""}${isAdmin ? '<p class="mini muted">管理員：全部同事的訂單請到「訂單統計／匯出」查看。</p>' : ""}</section>`;
      }
      function rememberedName() {
        try {
          return localStorage.getItem("lunch-person") || "";
        } catch {
          return "";
        }
      }
      function rememberName(n) {
        try {
          localStorage.setItem("lunch-person", n);
        } catch {}
      }
      function friendly(e, ctx) {
        let c = e?.code || "",
          m = e?.message || String(e),
          msg;
        if (c.includes("permission-denied"))
          msg =
            "權限不足（可能剛好已結單、不是你的訂單，或 Firebase 規則尚未更新）";
        else if (
          c.includes("unavailable") ||
          c === "auth/network-request-failed"
        )
          msg = "網路不穩定，連不上伺服器，請確認網路後重新整理";
        else if (
          c === "auth/operation-not-allowed" ||
          c === "auth/admin-restricted-operation"
        )
          msg =
            "尚未啟用匿名登入，請管理員到 Firebase Authentication 啟用 Anonymous";
        else if (
          [
            "auth/invalid-credential",
            "auth/wrong-password",
            "auth/user-not-found",
            "auth/invalid-email",
          ].includes(c)
        )
          msg = "帳號或密碼錯誤";
        else if (c === "auth/too-many-requests")
          msg = "嘗試次數過多，請稍後再試";
        else msg = m;
        return (ctx ? ctx + "：" : "") + msg + (c ? "（" + c + "）" : "");
      }
      function refresh() {
        if (tab === "order" && formOpen) {
          if (editingOrder && !active(editingOrder) && !closedWarned) {
            closedWarned = true;
            toast("這個場次剛剛已結單，目前無法送出", "warn");
          }
          return;
        }
        if (tab === "shops" && $("#editor")?.innerHTML.trim()) return;
        render();
      }
      function showOrder(t, oid) {
        let s = state.sessions[t],
          sh = shopBy(s.shopId),
          old = null;
        if (oid) {
          old = state.orders.find((x) => x.id === oid);
          if (!old || !canChange(old)) {
            toast("這筆訂單已無法修改", "warn");
            render();
            return;
          }
        }
        if (!active(t) || !sh) {
          toast("目前沒有開放訂餐", "warn");
          render();
          return;
        }
        editingOrder = t;
        editingId = old ? old.id : null;
        formOpen = true;
        closedWarned = false;
        cart[t] = old ? structuredClone(old.lines) : [];
        $("#view").innerHTML =
          `<div class="row between"><h2>${old ? "修改訂單｜" : ""}${typeName(t)}｜${esc(sh.name)}</h2><button class="secondary" onclick="render()">返回</button></div><section class="panel"><label>訂餐人姓名</label><input id="person" type="text" placeholder="請輸入姓名" maxlength="50" value="${esc(old ? old.person : rememberedName())}"><label>品項</label><div id="products">${
            sh.items
              .filter((i) => s.selected.includes(i.id))
              .map(
                (i) =>
                  `<div class="menu-item"><div><strong>${esc(i.name)}</strong><small>${money(i.price)}</small></div><button onclick="addLine('${t}','${i.id}')">加入</button></div>`,
              )
              .join("") || "<p>今天尚無可訂品項</p>"
          }</div></section><section class="panel"><h3>我的購物清單</h3><div id="cart"></div><label>整筆訂單備註</label><textarea id="orderNote" placeholder="例如：不要香菜、外帶等">${esc(old ? old.note : "")}</textarea><p class="right"><strong id="total">合計 $0</strong></p><button id="submitBtn" onclick="submitOrder('${t}')">${old ? "儲存修改" : "送出訂單"}</button></section>`;
        drawCart(t);
      }
      function addLine(t, id) {
        let sh = shopBy(state.sessions[t].shopId),
          i = sh.items.find((x) => x.id === id);
        cart[t].push({
          id: uid(),
          itemId: id,
          name: i.name,
          price: i.price,
          qty: 1,

              o.date,
              o.type === "meal" ? "正餐" : "飲料",
              o.shopName,
              bagNum(o),
              o.person,
              l.name,
              l.sugar || "",
              l.ice || "",
              (l.toppings || []).map((t) => t.name).join("+"),
              l.qty,
              (Number(l.price) +
                (l.toppings || []).reduce((a, x) => a + Number(x.price), 0)) *
                l.qty,
              o.note || "",
            ]);
          }
        download(
          "分袋清單-" + new Date().toLocaleDateString("sv-SE") + ".csv",
          "\ufeff" + rows.map((r) => r.map(csvCell).join(",")).join("\r\n"),
          "text/csv;charset=utf-8",
        );
      }
      function download(name, content, type) {
        let blob = new Blob([content], { type }),
          a = document.createElement("a"),
          url = URL.createObjectURL(blob);
        a.href = url;
        a.download = name;
        document.body.append(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 2000);
      }
      function csvCell(v) {
        let s = String(v ?? "");
        if (/^[=+@\-\t\r]/.test(s)) s = "'" + s;
        return '"' + s.replace(/"/g, '""') + '"';
      }
      function exportCSV() {
        let rows = [
          [
            "日期",
            "時間",
            "類型",
            "店家",
            "姓名",
            "餐點",
            "單價",
            "數量",
            "甜度",
            "冰量／溫度",
            "加料",
            "加料單價合計",
            "小計",
            "整筆備註",
          ],
        ];
        for (let o of filtered())
          for (let l of o.lines) {
            let top = l.toppings.reduce((a, x) => a + x.price, 0);
            rows.push([
              o.date,
              o.createdAt,
              o.type === "meal" ? "正餐" : "飲料",
              o.shopName,
              o.person,
              l.name,
              l.price,
              l.qty,
              l.sugar,
              l.ice,
              l.toppings.map((x) => x.name).join("+"),
              top,
              (l.price + top) * l.qty,
              o.note,
            ]);
          }
        download(
          "訂餐明細-" + new Date().toLocaleDateString("sv-SE") + ".csv",
          "\ufeff" + rows.map((r) => r.map(csvCell).join(",")).join("\r\n"),
          "text/csv;charset=utf-8",
        );
      }
      function exportBackup() {
        if (!isAdmin) return;
        download(
          "訂餐雲端備份.json",
          JSON.stringify(state, null, 2),
          "application/json",
        );
      }
      const firebaseModule =
        "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
      const authModule =
        "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
      const dbModule =
        "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
      const [
        { initializeApp },
        {
          getAuth,
          onAuthStateChanged,
          signInAnonymously,
          signInWithEmailAndPassword,
          signOut,
        },
        {
          getFirestore,
          doc,
          getDoc,
          setDoc,
          collection,
          addDoc,
          deleteDoc,
          updateDoc,
          onSnapshot,
          query,
          where,
        },
      ] = await Promise.all([
        import(firebaseModule),
        import(authModule),
        import(dbModule),
      ]);
      const { firebaseConfig } = await import("./firebase-config.js");
      const app = initializeApp(firebaseConfig),
        auth = getAuth(app),
        db = getFirestore(app);
      let listenGen = 0,
        ready = false,
        isAdmin = false,
        unsubConfig = null,
        unsubOrders = null,
        cloudConfig = null,
        configWrite = Promise.resolve();
      const isConfigured = () =>
        firebaseConfig.apiKey && !firebaseConfig.apiKey.includes("PASTE_");
      function status(s) {
        let el = document.getElementById("connection");
        el.textContent = s;
        el.className =
          "pill" +
          (/失敗|尚未/.test(s)
            ? " closed"
            : /同步中|連接|切換/.test(s)
              ? " warn"
              : "");
      }
      function showLogin() {
        let u = auth.currentUser;
        if (u && !u.isAnonymous) {
          if (confirm(isAdmin ? "要登出管理員嗎？" : "要登出這個帳號嗎？"))
            signOut(auth);
          return;
        }
        let email = prompt("管理員帳號（Email）");
        if (!email) return;
        let password = prompt("管理員密碼（不會存入網站）");
        if (!password) return;
        signInWithEmailAndPassword(auth, email.trim(), password).catch((e) =>
          showBanner(friendly(e, "登入失敗"), "error", "login"),
        );
      }
      window.showLogin = showLogin;
      async function saveConfig() {
        if (!isAdmin) {
          toast("只有管理員可以修改設定", "warn");
          return;
        }
        let payload = {
          shops: structuredClone(state.shops),
          sessions: structuredClone(state.sessions),
        };
        configWrite = configWrite
          .then(() => setDoc(doc(db, "public", "config"), payload))
          .catch((e) => {
            showBanner(friendly(e, "儲存設定失敗"), "error", "save");
            throw e;
          });
        try {
          await configWrite;
        } catch {
          configWrite = Promise.resolve();
        }
      }
      function subscribeData(user) {
        const gen = ++listenGen;
        if (unsubConfig) unsubConfig();
        if (unsubOrders) unsubOrders();
        ready = false;
        status("同步中...");
        unsubConfig = onSnapshot(
          doc(db, "public", "config"),
          (snap) => {
            if (snap.exists()) {
              let data = snap.data();
              state.shops = data.shops || [];
              state.sessions = data.sessions || state.sessions;
            } else {
              state.shops = [];
              state.sessions = {
                meal: { shopId: "", open: false, deadline: "", selected: [] },
                drink: { shopId: "", open: false, deadline: "", selected: [] },
              };
            }
            ready = true;
            window.__lunchReady = true;
            hideBanner("sync");
            status("已連線");
            refresh();
          },
          (e) => {
            if (gen !== listenGen) return;
            status("資料讀取失敗");
            showBanner(friendly(e, "無法讀取店家與菜單設定"), "error", "sync");
          },
        );
        let q = isAdmin
          ? query(collection(db, "orders"))
          : query(collection(db, "orders"), where("ownerUid", "==", user.uid));
        unsubOrders = onSnapshot(
          q,
          (snap) => {
            state.orders = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
            if (ready) refresh();
          },
          (e) => {
            if (gen !== listenGen) return;
            status("訂單同步失敗");
            showBanner(friendly(e, "無法讀取訂單"), "error", "sync");
          },
        );
      }
      onAuthStateChanged(auth, async (user) => {
        if (!user) {
          isAdmin = false;
          listenGen++;
          if (unsubConfig) {
            unsubConfig();
            unsubConfig = null;
          }
          if (unsubOrders) {
            unsubOrders();
            unsubOrders = null;
          }
          state.orders = [];
          ready = false;
          status("切換身分中...");
          try {
            await signInAnonymously(auth);
          } catch (e) {
            status("登入失敗");
            showBanner(friendly(e, "登入失敗"), "error", "sync");
          }
          return;
        }
        // 身分改變時先停止舊監聽，避免用新身分繼續讀舊查詢而被拒絕
        listenGen++;
        if (unsubConfig) {
          unsubConfig();
          unsubConfig = null;
        }
        if (unsubOrders) {
          unsubOrders();
          unsubOrders = null;
        }
        ready = false;
        status("同步中...");
        isAdmin = false;
        if (!user.isAnonymous) {
          // 管理員名單存在資料庫：admins/{使用者UID} 文件存在才是管理員
          try {
            isAdmin = (await getDoc(doc(db, "admins", user.uid))).exists();
          } catch (e) {
            isAdmin = false;
          }
          if (auth.currentUser?.uid !== user.uid) return;
          if (!isAdmin) toast("這個帳號不是管理員，已當作一般同事使用", "warn");
        }
        document.getElementById("authButton").textContent = user.isAnonymous
          ? "管理員登入"
          : "登出";
        document.getElementById("identity").textContent = isAdmin
          ? "管理員模式"
          : "同事訂餐";
        subscribeData(user);
      });
      if (!isConfigured()) {
        status("尚未設定 Firebase");
        showBanner(
          "尚未設定 Firebase：請先編輯 firebase-config.js，填入 apiKey。",
          "error",
          "config",
        );
      }
      // Inline handlers in module scripts are not global: explicitly expose the V4 UI callbacks.
      Object.assign(window, {
        showOrder,
        addLine,
        drawCart,
        toggleTop,
        submitOrder,
        removeOrder,
        setSessionShop,
        selectAll,
        selectItem,
        newShop,
        deleteShop,
        editShop,
        saveShop,
        drawRecords,
        setBag,
        exportBags,
        exportCSV,
        exportBackup,
        render,
        cart,
        bagFilter,
        save,
      });
      // V4 inline event handlers refer to these variables. Provide live bindings through properties.
      Object.defineProperty(window, "state", { get: () => state });
      Object.defineProperty(window, "cart", { get: () => cart });
    </script>
  </body>
</html>
